[project]
name = "finflow-agent"
version = "0.1.0"
description = "Personalised finance agent for FinFlow: LLM brain, Python guardrails."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-groq>=0.3",
  "firecrawl-py>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["**/*.md", "**/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Groq API (needs GROQ_API_KEY)"]
