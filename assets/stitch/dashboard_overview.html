<!-- BEGIN: Canvas Script -->
<script data-purpose="canvas-renderer">
    function drawChart() {
      const canvas = document.getElementById('spendingChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const parentWidth = canvas.parentElement.offsetWidth;
      canvas.width = parentWidth;
      canvas.height = 60;

      const data = [10, 25, 15, 45, 30, 60, 40];
      const max = Math.max(...data);
      const step = canvas.width / (data.length - 1);

      ctx.beginPath();
      ctx.strokeStyle = '#89eb00'; // custom_color (Neon Kiwi)
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      data.forEach((val, i) => {
        const x = i * step;
        const y = canvas.height - (val / max * (canvas.height - 10)) - 5;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.stroke();

      // Create gradient fill
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, 'rgba(137, 235, 0, 0.3)');
      gradient.addColorStop(1, 'rgba(137, 235, 0, 0)');
      
      ctx.lineTo((data.length - 1) * step, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    window.addEventListener('load', drawChart);
    window.addEventListener('resize', drawChart);
  </script>
<!-- END: Canvas Script -->
<script>
  const themeToggleBtn = document.getElementById('theme-toggle');
  themeToggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    // Force chart redraw if needed, though canvas colors are hardcoded currently
    if (typeof drawChart === 'function') drawChart();
  });
