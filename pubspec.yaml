name: personal_finance_app
description: "A new Flutter project for tracking personal finances."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.65.0
  flutter_heatmap_calendar: ^1.0.5
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
